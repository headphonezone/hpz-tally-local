<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HPZ Tally — sign in</title>
<style>
  :root { --bg: #f6f7f9; --panel: #fff; --ink: #1c2024; --muted: #6b7280; --line: #e3e6ea; --accent: #2563eb; --bad: #b91c1c; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; font: 14px/1.5 -apple-system, "Segoe UI", system-ui, sans-serif; background: var(--bg); color: var(--ink); }
  form { width: min(360px, 92vw); background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 26px 26px 22px; }
  h1 { font-size: 18px; margin: 0 0 4px; }
  p { margin: 0 0 18px; color: var(--muted); }
  label { display: block; font-size: 12px; color: var(--muted); margin: 12px 0 4px; }
  input { width: 100%; font: inherit; padding: 9px 11px; border: 1px solid var(--line); border-radius: 7px; background: var(--panel); color: var(--ink); }
  input:focus { outline: 2px solid rgba(37,99,235,.25); border-color: var(--accent); }
  button { width: 100%; margin-top: 18px; font: inherit; font-weight: 600; padding: 9px; border: 1px solid var(--accent); background: var(--accent); color: #fff; border-radius: 7px; cursor: pointer; }
  button:disabled { opacity: .6; cursor: default; }
  #err { color: var(--bad); min-height: 20px; margin-top: 12px; font-size: 13px; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #111418; --panel: #1a1e24; --ink: #e8eaed; --muted: #9aa3ad; --line: #2b313a; --accent: #3b82f6; --bad: #f87171; }
  }
</style>
</head>
<body>
<form id="f" autocomplete="on">
  <h1>HPZ Tally</h1>
  <p>Sign in to continue.</p>
  <label for="u">Name</label>
  <input id="u" name="username" autocomplete="username" autocapitalize="none" spellcheck="false" required autofocus>
  <label for="p">Password</label>
  <input id="p" name="password" type="password" autocomplete="current-password" required>
  <button id="go" type="submit">Sign in</button>
  <div id="err" role="alert"></div>
</form>
<script>
const $ = (id) => document.getElementById(id);
$('f').onsubmit = async (e) => {
  e.preventDefault();
  $('go').disabled = true; $('err').textContent = '';
  try {
    const r = await fetch('/api/login', { method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username: $('u').value.trim().toLowerCase(), password: $('p').value }) });
    const d = await r.json().catch(() => ({}));
    if (r.ok) { location.href = '/'; return; }
    $('err').textContent = d.error || 'Could not sign in';
    $('p').value = ''; $('p').focus();
  } catch { $('err').textContent = 'Could not reach the app'; }
  $('go').disabled = false;
};
</script>
</body>
</html>
